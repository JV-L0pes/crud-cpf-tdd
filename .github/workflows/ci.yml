name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Qualidade (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Formatação
        run: npm run format:check
      - name: Análise estática
        run: npm run lint
      - name: Testes
        run: npm test

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t crud-cpf-tdd .
